<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Soundboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-gray-900 text-white p-6 flex flex-col items-center text-center">

    <div class="flex items-center gap-4 mb-6">

        <h1 class="text-3xl font-bold">Soundboard</h1>

        <button id="wakeLockBtn" onclick="toggleWakeLock()"
            class="px-4 py-2 bg-gray-700 rounded-lg hover:bg-gray-600 transition-all">

            🔓 Awake OFF

        </button>

    </div>

    <div class="mb-6 flex flex-wrap items-center justify-center gap-3">

        <input id="newGroupName" type="text" placeholder="New Group Name" class="px-3 py-2 rounded text-black w-64">

        <button onclick="addGroup()" class="px-4 py-2 bg-blue-600 rounded hover:bg-blue-700 whitespace-nowrap">

            <i class="fa-solid fa-folder-plus mr-2"></i>
            Add Group

        </button>

        <label for="soundUpload"
            class="cursor-pointer px-4 py-2 bg-green-600 hover:bg-green-700 rounded whitespace-nowrap transition-all">

            <i class="fa-solid fa-upload mr-2"></i>
            Upload Sound

        </label>

        <input id="soundUpload" type="file" accept="audio/*" class="hidden" onchange="uploadSound(event)">

    </div>

    <p class="text-sm text-gray-400 mb-6">
        Select a group, then upload sounds to it.
    </p>

    <!-- GROUP BUTTONS -->
    <div id="groupButtons" class="flex flex-wrap justify-center gap-3 mb-8"></div>

    <!-- SOUND GRID -->
    <div id="soundGrid"
        class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 w-full max-w-5xl mx-auto">
    </div>

    <!-- DELETE SOUND MODAL -->
    <div id="deleteModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70"
        onclick="cancelDelete()">
        <div class="bg-gray-800 p-6 rounded-xl shadow-2xl text-center w-80" onclick="event.stopPropagation()">
            <h2 class="text-xl font-bold mb-4">Delete Sound?</h2>
            <p class="mb-6">Are you sure you want to delete this sound?</p>
            <div class="flex justify-center space-x-4">
                <button onclick="confirmDelete()" class="px-4 py-2 bg-red-600 rounded hover:bg-red-700">
                    Delete
                </button>
                <button onclick="cancelDelete()" class="px-4 py-2 bg-gray-600 rounded hover:bg-gray-700">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <!-- GROUP OPTIONS MODAL -->
    <div id="groupOptionsModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70"
        onclick="closeGroupOptions()">
        <div class="bg-gray-800 p-6 rounded-xl shadow-2xl text-center w-96" onclick="event.stopPropagation()">
            <h2 class="text-xl font-bold mb-4">Group Options</h2>
            <input id="groupRenameInput" type="text" placeholder="Group Name"
                class="w-full px-3 py-2 rounded text-black mb-4">
            <button id="renameGroupBtn" class="px-4 py-2 bg-green-600 rounded hover:bg-green-700 mb-4">Save
                Name</button>
            <p class="mb-4">Choose a button color:</p>
            <div id="colorOptions" class="flex justify-center space-x-4 mb-6"></div>

            <button onclick="deleteSelectedGroup()" class="px-4 py-2 bg-red-600 rounded hover:bg-red-700 mb-4">
                Delete Group
            </button>

            <button onclick="closeGroupOptions()" class="px-4 py-2 bg-gray-600 rounded hover:bg-gray-700">
                Close
            </button>
        </div>
    </div>

    <!-- SOUND OPTIONS MODAL -->
    <div id="soundOptionsModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70"
        onclick="closeSoundOptions()">

        <div class="bg-gray-800 p-6 rounded-xl shadow-2xl text-center w-96" onclick="event.stopPropagation()">

            <h2 class="text-xl font-bold mb-4">
                Sound Options
            </h2>

            <p class="mb-3">Sound Color</p>

            <div id="soundColorOptions" class="flex justify-center gap-3 mb-6">
            </div>

            <div class="mb-6">

                <button id="soundLoopBtn" class="px-4 py-2 rounded bg-gray-700 hover:bg-gray-600 mr-2">
                    Loop
                </button>

                <button id="soundFadeBtn" class="px-4 py-2 rounded bg-gray-700 hover:bg-gray-600">
                    Fade
                </button>

            </div>

            <div class="mb-6">

                <input id="soundVolumeSlider" type="range" min="0" max="1" step="0.01" class="w-full">

            </div>

            <button id="soundDeleteBtn" class="px-4 py-2 bg-red-600 rounded hover:bg-red-700 mb-4">
                Delete Sound
            </button>

            <br>

            <button onclick="closeSoundOptions()" class="px-4 py-2 bg-gray-600 rounded hover:bg-gray-700">
                Close
            </button>

        </div>
    </div>

    <script src="main.js"></script>

</body>

</html>
